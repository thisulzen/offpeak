services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: offpeak
      POSTGRES_PASSWORD: offpeak
      POSTGRES_DB: offpeak
    ports: ["5432:5432"]
    healthcheck:
      test: pg_isready -U offpeak
      interval: 2s
      retries: 20

  api:
    build: api
    environment: &env
      DATABASE_URL: postgresql://offpeak:offpeak@db:5432/offpeak
      LLM_API_KEY: ${LLM_API_KEY:-}
      PLANS_SOURCE: ${PLANS_SOURCE:-live}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    build: api
    command: python worker.py
    environment: *env
    depends_on:
      db: { condition: service_healthy }

  web:
    build: web
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["8080:80"]
